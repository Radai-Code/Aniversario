<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Ti 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose:  #c2678a;
      --roselt:#e8839f;
      --gold:  #d4a76a;
      --ink:   #3a2a35;
      --parch: #fef9f2;
      --glass: rgba(255,255,255,0.60);
      --sh:    rgba(60,20,40,0.14);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      height:100%; overflow:hidden;
      font-family:'Cormorant Garamond',serif;
      background:
        radial-gradient(ellipse at 30% 10%, #fce4ec 0%, #f8bbd0 40%, #f48fb1 75%, transparent 100%),
        linear-gradient(150deg,#fce4ec,#f8bbd0);
    }

    #bg-canvas { position:fixed; inset:0; pointer-events:none; z-index:0; will-change: transform; }

    .app {
      position:relative; z-index:10;
      width:100%; height:100%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:clamp(8px,2vh,18px) clamp(10px,3vw,18px);
      gap:clamp(7px,1.6vh,13px);
    }

    /* CONTADOR */
    .counter {
      width:min(460px,100%);
      background:var(--glass); backdrop-filter:blur(16px);
      border:1px solid rgba(232,160,180,0.38); border-radius:40px;
      padding:clamp(7px,1.5vh,11px) clamp(14px,4vw,26px);
      text-align:center; box-shadow:0 4px 18px var(--sh);
    }
    .counter-main { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px 10px; }
    .counter-unit { display:flex; flex-direction:column; align-items:center; }
    .counter-val  { font-family:'Playfair Display',serif; font-size:clamp(1rem,3.8vw,1.45rem); color:var(--rose); font-weight:700; line-height:1; }
    .counter-lbl  { font-size:clamp(0.52rem,1.5vw,0.62rem); color:var(--ink); opacity:0.48; text-transform:uppercase; letter-spacing:0.1em; }
    .counter-sep  { color:rgba(194,103,138,0.32); font-size:0.88rem; align-self:flex-start; margin-top:3px; }
    .counter-since{ margin-top:4px; font-size:clamp(0.56rem,1.6vw,0.68rem); color:var(--rose); opacity:0.68; font-style:italic; }

    /* LIBRO */
    .book-scene { width:min(460px,100%); height:clamp(240px,43vh,400px); perspective:1800px; flex-shrink:0; }
    .book { width:100%; height:100%; position:relative; transform-style:preserve-3d; }

    .spine {
      position:absolute; left:0; top:0; width:26px; height:100%;
      background:linear-gradient(180deg,var(--rose) 0%,#9e4b6a 50%,var(--rose) 100%);
      border-radius:6px 0 0 6px; z-index:200;
      box-shadow:-2px 0 8px rgba(60,20,40,0.22);
    }

    .page {
      position:absolute; top:4px; left:26px;
      width:calc(100% - 30px); height:calc(100% - 8px);
      background:var(--parch); border-radius:0 10px 10px 0;
      transform-origin:left center;
      transition:transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-style:preserve-3d; backface-visibility:hidden;
      box-shadow:inset 2px 0 8px rgba(0,0,0,0.04), 2px 2px 7px rgba(0,0,0,0.1);
      will-change: transform;
    }
    .page.flipped { transform:rotateY(-180deg); }

    .p-front, .p-back {
      position:absolute; inset:0;
      padding:clamp(12px,3vw,26px) clamp(12px,3vw,24px);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; backface-visibility:hidden; border-radius:0 10px 10px 0;
    }
    .p-back { transform:rotateY(180deg); background:#fdf5f8; }

    .cover { background:linear-gradient(135deg,#f4b8cf,#e8839f 45%,#c2678a) !important; z-index:150; cursor:pointer; border-radius:0 12px 12px 0; }

    /* NAV & MUSIC (Simplificado para rendimiento) */
    .book-nav { display:flex; align-items:center; gap:14px; margin-top: 10px; }
    .nav-btn  {
      width:40px; height:40px; border-radius:50%;
      border:2px solid rgba(194,103,138,0.32); background:var(--glass);
      color:var(--rose); font-size:1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }

    .music-bar {
      width:min(460px,100%); background:var(--glass); backdrop-filter:blur(14px);
      border:1.5px solid rgba(194,103,138,0.28); border-radius:16px;
      padding:10px 15px; display:flex; align-items:center; gap:12px;
      box-shadow:0 3px 14px var(--sh);
    }
    .music-info { flex:1; }
    .music-progress { width:100%; height:4px; background:rgba(194,103,138,0.1); border-radius:2px; margin-top:8px; cursor:pointer; position:relative; }
    .music-fill { height:100%; background:var(--rose); width:0%; border-radius:2px; }

    /* MODALES */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:1000; display:none; align-items:center; justify-content:center; }
    .overlay.on { display:flex; }
    .mbox { background:var(--parch); padding:25px; border-radius:20px; width:90%; max-width:400px; }

    .btn-add {
      position:fixed; bottom:20px; right:20px; width:50px; height:50px;
      background:var(--rose); color:white; border:none; border-radius:50%;
      font-size:24px; cursor:pointer; box-shadow:0 4px 15px var(--sh);
      display:none; align-items:center; justify-content:center; z-index:100;
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">
  <div class="counter">
    <div class="counter-main">
      <div class="counter-unit"><span class="counter-val" id="c-y">0</span><span class="counter-lbl">años</span></div>
      <span class="counter-sep">·</span>
      <div class="counter-unit"><span class="counter-val" id="c-m">0</span><span class="counter-lbl">meses</span></div>
      <span class="counter-sep">·</span>
      <div class="counter-unit"><span class="counter-val" id="c-d">0</span><span class="counter-lbl">días</span></div>
    </div>
    <div class="counter-since" id="c-since"></div>
  </div>

  <div class="book-scene">
    <div class="book">
      <div class="spine"></div>
      <div id="pages-root"></div>
      <div class="page cover" id="cover" onclick="openBook()">
        <div class="p-front">
          <h2 style="color:white; font-size: 1.8rem;">Para Ti 💖</h2>
          <p style="color:white; opacity:0.8;">Toca para abrir nuestra historia</p>
        </div>
      </div>
    </div>
  </div>

  <div class="book-nav" id="book-nav" style="display:none">
    <button class="nav-btn" onclick="prevPage()">←</button>
    <div id="nav-ind" style="font-size:0.9rem; color:var(--rose)">1 / 1</div>
    <button class="nav-btn" onclick="nextPage()">→</button>
  </div>

  <div class="music-bar" id="music-bar" style="display:none">
    <div class="music-info">
      <div id="music-title" style="font-size:0.8rem; font-weight:bold; color:var(--rose)">Cargando música...</div>
      <div class="music-progress" onclick="seekMusic(event)"><div class="music-fill" id="music-fill"></div></div>
    </div>
    <button class="nav-btn" id="btn-play" onclick="togglePlay()">▷</button>
  </div>
</div>

<div id="yt-player" style="position:absolute; top:-999px;"></div>
<button class="btn-add" id="btn-add" onclick="openAddModal()">+</button>

<div class="overlay" id="ov-add" onclick="if(event.target===this)closeAddModal()">
  <div class="mbox">
    <h3>Escribir nueva nota</h3>
    <textarea id="in-quote" style="width:100%; margin-top:10px; padding:10px;" rows="3" placeholder="Tu mensaje..."></textarea>
    <button onclick="saveQuote()" style="width:100%; background:var(--rose); color:white; border:none; padding:10px; margin-top:10px; border-radius:5px;">Guardar 💖</button>
  </div>
</div>

<script>
const START = new Date('2024-12-13T00:00:00');
const PLAYLIST = [
  { title:'The Reason', id:'fV4DiAyExN0' },
  { title:'Wonderwall',  id:'bx1Bh8ZvH84' }
];

const FIXED = [
  { q:'No importa lo que pase mañana, te quiero hoy.', s:'Nuestro Camino Eterno' },
  { q:'¿Me amas? ¿Real o no real? —Real.', s:'Los Juegos del Hambre' }
];

let pages = [], curPage = -1, bookOpen = false, ytReady = false, ytPlayer = null;

// INICIALIZACIÓN
function buildBook() {
  const root = document.getElementById('pages-root');
  root.innerHTML = '';
  const all = [...FIXED, ...JSON.parse(localStorage.getItem('amor_q') || '[]')];
  all.forEach((item, i) => {
    const pg = document.createElement('div');
    pg.className = 'page';
    pg.style.zIndex = all.length - i;
    pg.innerHTML = `<div class="p-front"><p>"${item.q}"</p><span>${item.s}</span></div><div class="p-back">💖</div>`;
    root.appendChild(pg);
    pages.push(pg);
  });
  document.getElementById('nav-ind').textContent = `1 / ${pages.length}`;
}

function openBook() {
  if(bookOpen) return;
  bookOpen = true;
  document.getElementById('cover').classList.add('flipped');
  document.getElementById('book-nav').style.display = 'flex';
  document.getElementById('btn-add').style.display = 'flex';
  document.getElementById('music-bar').style.display = 'flex';
  
  // UNLOCK AUDIO PARA MÓVILES
  if(ytReady && ytPlayer) {
    ytPlayer.playVideo();
  }
  
  setTimeout(() => { curPage = 0; updateNav(); }, 800);
}

// NAVEGACIÓN
function nextPage() { if(curPage < pages.length-1) { curPage++; pages[curPage].classList.add('flipped'); updateNav(); }}
function prevPage() { if(curPage >= 0) { pages[curPage].classList.remove('flipped'); curPage--; updateNav(); }}
function updateNav() { document.getElementById('nav-ind').textContent = `${Math.max(1, curPage+1)} / ${pages.length}`; }

// PERSISTENCIA
function saveQuote() {
  const q = document.getElementById('in-quote').value;
  if(!q) return;
  const custom = JSON.parse(localStorage.getItem('amor_q') || '[]');
  custom.push({q, s: 'Escrito por nosotros'});
  localStorage.setItem('amor_q', JSON.stringify(custom));
  location.reload(); // Recarga para reconstruir el libro con la nueva página
}

// YOUTUBE API
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '0', width: '0', videoId: PLAYLIST[0].id,
    events: {
      'onReady': (e) => { ytReady = true; document.getElementById('music-title').textContent = PLAYLIST[0].title; },
      'onStateChange': (e) => {
        const btn = document.getElementById('btn-play');
        btn.textContent = (e.data === YT.PlayerState.PLAYING) ? '⏸' : '▷';
      }
    }
  });
}

function togglePlay() { if(ytReady) ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); }

// CONTADOR Y CANVAS (Optimizado)
function updateCounter() {
  const diff = new Date() - START;
  document.getElementById('c-y').textContent = Math.floor(diff / (1000*60*60*24*365));
  document.getElementById('c-m').textContent = Math.floor((diff % (1000*60*60*24*365)) / (1000*60*60*24*30));
  document.getElementById('c-d').textContent = Math.floor((diff % (1000*60*60*24*30)) / (1000*60*60*24));
}
updateCounter();
buildBook();

// Partículas ligeras para CERO LAG
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
function render() {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
